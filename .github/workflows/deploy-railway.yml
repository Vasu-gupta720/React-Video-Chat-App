name: Deploy to Railway

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Railway CLI
      run: curl -sSL https://railway.app/install.sh | sh

    - name: Login to Railway
      env:
        RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
      run: |
        if [ -z "$RAILWAY_API_KEY" ]; then echo "RAILWAY_API_KEY secret is missing"; exit 1; fi
        railway login --apiKey "$RAILWAY_API_KEY"

    - name: Deploy server
      working-directory: ./server
      run: |
        npm ci
        # Deploy the server service (railway will prompt if service not configured).
        railway up --detach || true

    - name: Build client
      working-directory: ./client
      run: |
        npm ci
        npm run build

    - name: Deploy client
      working-directory: ./client
      run: |
        # Railway can deploy the client folder; ensure `npm start` serves the build
        railway up --detach || true
